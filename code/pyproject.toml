[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis"
version = "0.0.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["data_processing", "models", "training", "evaluation", "analysis"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
