[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis"
version = "0.0.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["data_processing", "models", "training", "evaluation", "analysis", "annotation"]

[tool.setuptools.package-data]
annotation = ["app/*.html"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["C408"]  # dict(key=value) is used on purpose for records

[tool.ruff.lint.per-file-ignores]
"**/[0-9][0-9]_*.py" = ["N999", "E402"]  # numbered notebook sources

[tool.pytest.ini_options]
testpaths = ["tests"]
